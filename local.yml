---
- name: Configure local machine
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Dynamically load host-specific variables matching system hostname
      ansible.builtin.include_vars:
        file: "inventories/local/host_vars/{{ ansible_facts['hostname'] }}.yml"

  tasks:
    - name: Run specified or enabled roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ [run_role] if run_role is defined else enabled_roles }}"
