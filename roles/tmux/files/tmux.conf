# ==============================================================================
# Doom Emacs / Vim Keybindings Configuration for Tmux
# Leader Key: Alt + Space
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Leader & General Settings
# ------------------------------------------------------------------------------
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# Detach session (remapped from default 'd' to 'q' - Doom style quit/detach)
bind q detach-client

# Quality of Life
set -g mouse on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Terminal Colors
set -g default-terminal "tmux-256color"

# Enable Vim modal controls in scroll mode
setw -g mode-keys vi

# ------------------------------------------------------------------------------
# 2. Key Tables Setup (Doom-style modal sequences: TAB, w, s)
# ------------------------------------------------------------------------------
# Mappings to trigger key tables directly after Leader
bind TAB switch-client -T tab-keys
bind Tab switch-client -T tab-keys
bind w switch-client -T window-keys
bind s switch-client -T session-keys

# ------------------------------------------------------------------------------
# 3. Workspace / Window Management (<Leader> + TAB)
# ------------------------------------------------------------------------------
bind -T tab-keys TAB choose-window
bind -T tab-keys n new-window -c "#{pane_current_path}"
bind -T tab-keys d kill-window                            # [TAB d] Delete current window/tab
bind -T tab-keys r command-prompt -I "#W" "rename-window '%%'"

# Direct Alt + Number switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# ------------------------------------------------------------------------------
# 4. Pane / Window Splits (<Leader> + w)
# ------------------------------------------------------------------------------
bind -T window-keys v split-window -h -c "#{pane_current_path}"
bind -T window-keys s split-window -v -c "#{pane_current_path}"
bind -T window-keys d kill-pane                            # [w d] Delete current pane
bind -T window-keys o kill-pane -a                         # [w o] Delete all OTHER panes

# Pane Navigation (Vim Keys)
bind -T window-keys h select-pane -L
bind -T window-keys j select-pane -D
bind -T window-keys k select-pane -U
bind -T window-keys l select-pane -R

# Pane Resizing (<Leader> + w + Shift H/J/K/L)
bind -r -T window-keys H resize-pane -L 5
bind -r -T window-keys J resize-pane -D 5
bind -r -T window-keys K resize-pane -U 5
bind -r -T window-keys L resize-pane -R 5

# Move window left/right (repeatable with -r)
bind -r < swap-window -t -1 -d   # [<] Move current window left
bind -r > swap-window -t +1 -d   # [>] Move current window right

# ------------------------------------------------------------------------------
# 5. Session Management (<Leader> + s)
# ------------------------------------------------------------------------------
bind -T session-keys s choose-session
bind -T session-keys n new-session
bind -T session-keys r command-prompt -I "#S" "rename-session '%%'"
bind -T session-keys d kill-session                        # [s d] Delete current session
bind -T session-keys q detach-client                       # [s q] Detach session

# ------------------------------------------------------------------------------
# 6. Vim-Style Copy Mode / Visual Selection ([)
# ------------------------------------------------------------------------------
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ------------------------------------------------------------------------------
# 7. Doom Emacs Utility Hotkeys
# ------------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

# ------------------------------------------------------------------------------
# 8. Theme - Visual Studio Code Dark+
# ------------------------------------------------------------------------------
# Dark+ is grey + one signature blue; green is reserved there for the remote
# indicator, so accents are drawn from the statusBar/textLink blues instead.
# Palette, taken from the Dark+ (dark_vs) theme:
#   gray_light   #D4D4D4  editor.foreground
#   gray_medium  #858585  editorLineNumber.foreground   (reserved, currently unused)
#   gray_dark    #1E1E1E  editor.background
#   blue         #007ACC  statusBarItem.background
#   blue_bright  #3794FF  textLink.foreground
gray_light="#D4D4D4"
gray_medium="#858585"
gray_dark="#1E1E1E"
blue="#007ACC"
blue_bright="#3794FF"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${blue_bright},bold] #S #[fg=${gray_light},nobold] | "
set -g status-right ""
set -g window-status-current-format "#[fg=${blue_bright},bold] #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${blue}"

# ------------------------------------------------------------------------------
# 9. Plugins & TPM
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

### PLUGIN CONFIG ###
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
