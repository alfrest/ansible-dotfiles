---
- name: samba
  tags: [samba]
  block:
    - name: Ensure the samba directory exists
      become: true
      ansible.builtin.file:
        path: "{{ srv_container_root }}/samba"
        state: directory
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0755'

    - name: Deploy the samba environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ srv_container_root }}/samba/.env"
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0600'

    - name: Deploy the samba compose file
      ansible.builtin.copy:
        src: docker-compose.yml
        dest: "{{ srv_container_root }}/samba/docker-compose.yml"
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0644'

    - name: Start or reconcile the samba stack
      community.docker.docker_compose_v2:
        project_src: "{{ srv_container_root }}/samba"
        state: present
        pull: policy
        remove_orphans: true
        wait: true
        wait_timeout: 600