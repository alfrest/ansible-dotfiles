---
- name: ums
  tags: [ums]
  block:
    - name: Ensure the ums directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0755'
      loop:
        - "{{ srv_container_root }}/ums"
        - "{{ srv_container_root }}/ums/config"

    - name: Deploy the ums environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ srv_container_root }}/ums/.env"
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0600'

    - name: Deploy the ums compose file
      ansible.builtin.copy:
        src: docker-compose.yml
        dest: "{{ srv_container_root }}/ums/docker-compose.yml"
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0644'

    - name: Start or reconcile the ums stack
      community.docker.docker_compose_v2:
        project_src: "{{ srv_container_root }}/ums"
        state: present
        pull: policy
        remove_orphans: true
        wait: true
        wait_timeout: 600