---
- name: Install Niri core components
  become: true
  community.general.pacman:
    name: "{{ item }}"
    state: present
  loop:
    - niri
    - xwayland-satellite
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - noctalia
    - greetd-tuigreet

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/niri"
    state: directory
    mode: '0755'

- name: Deploy template
  ansible.builtin.template:
    src: config.kdl.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/niri/config.kdl"
    mode: '0644'
