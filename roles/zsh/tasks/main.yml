---
- name: Install zsh
  become: true
  ansible.builtin.package:
    name:
      - zsh
    state: present

- name: Clone Oh My Zsh repository
  ansible.builtin.git:
    repo: 'https://github.com/ohmyzsh/ohmyzsh.git'
    dest: "{{ ansible_facts.user_dir }}/.oh-my-zsh"
    depth: 1

- name: Clone Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
  loop:
    - name: zsh-syntax-highlighting
      repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git


- name: Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/zshrc"
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    state: link
    force: true

- name: Deploy template
  ansible.builtin.template:
    src: zshenv.j2
    dest: "{{ ansible_facts['user_dir'] }}/.zshenv"
    mode: '0644'

- name: Set default user shell to Zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
