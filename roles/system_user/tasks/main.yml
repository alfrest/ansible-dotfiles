- name: Install zsh on arch
  become: true
  community.general.pacman:
    name:
      - zsh
    state: present

- name: Install zsh on fedora
  become: true
  ansible.builtin.dnf5:
    name:
      - zsh
    state: present

- name: Set default user shell to Zsh
  become: true
  ansible.builtin.user:
    name: "alfrest"
    shell: /usr/bin/zsh
