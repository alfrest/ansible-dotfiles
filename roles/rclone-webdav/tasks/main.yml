---
- name: rclone-webdav
  tags: [rclone-webdav]
  block:
    - name: Ensure the rclone-webdav directory exists
      become: true
      ansible.builtin.file:
        path: "{{ srv_container_root }}/rclone-webdav"
        state: directory
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0755'

    - name: Deploy the rclone-webdav environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ srv_container_root }}/rclone-webdav/.env"
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0600'

    - name: Deploy the rclone-webdav compose file
      ansible.builtin.copy:
        src: docker-compose.yml
        dest: "{{ srv_container_root }}/rclone-webdav/docker-compose.yml"
        owner: "{{ srv_puid }}"
        group: "{{ srv_pgid }}"
        mode: '0644'

    - name: Start or reconcile the rclone-webdav stack
      community.docker.docker_compose_v2:
        project_src: "{{ srv_container_root }}/rclone-webdav"
        state: present
        pull: policy
        remove_orphans: true
        wait: true
        wait_timeout: 600